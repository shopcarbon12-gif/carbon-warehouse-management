# Carbon B2B Shipping Rules — public app (App Store, unlisted).
# One job: at checkout, B2B (company) buyers only see the shipping option(s)
# the merchant keeps (default "Standard"), optionally renamed. Retail untouched.

client_id = "5db5b5123cb24a6848c6050b87c99d37"
name = "Carbon B2B Shipping Rules"
application_url = "https://b2b-shipping.shopcarbon.com"
embedded = true

[access_scopes]
scopes = "read_delivery_customizations,write_delivery_customizations"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Mandatory privacy (GDPR) webhooks. The app stores no customer data.
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [
  "https://b2b-shipping.shopcarbon.com/auth/callback",
  "https://b2b-shipping.shopcarbon.com/auth/shopify/callback",
  "https://b2b-shipping.shopcarbon.com/api/auth/callback"
]

[pos]
embedded = false

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = false
